subprojects {
	apply plugin: 'java'

	group = 'dev.loadout'
	version = '0.1.0'

	repositories {
		mavenCentral()
	}

	java {
		// 21, not 25. The mod half will need 25 because Minecraft 26.1+ does, but the
		// launcher has to start on whatever JDK a user already has -- and someone whose
		// Java is out of date is exactly who needs a launcher to fix it for them.
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	dependencies {
		testImplementation platform('org.junit:junit-bom:5.11.4')
		testImplementation 'org.junit.jupiter:junit-jupiter'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	test {
		useJUnitPlatform()
	}
}

// Assembles the thing a user actually installs: the jar renamed to loadout.jar with
// the shims beside it, so bin/loadout finds it without knowing the version number.
// Keeping the version out of the installed file name is deliberate -- otherwise every
// upgrade leaves a stale jar next to the new one and the shim has to guess.
tasks.register('dist', Sync) {
	description = 'Builds an installable distribution into build/dist.'
	group = 'distribution'

	dependsOn ':launcher:jar'

	into layout.buildDirectory.dir('dist')

	from(tasks.getByPath(':launcher:jar')) {
		rename { 'loadout.jar' }
	}
	from('bin') {
		// Executable, or the shell shim cannot be run directly on Linux and macOS.
		filePermissions { unix('rwxr-xr-x') }
	}
	from('README.md')
	from('LICENSE')
}
